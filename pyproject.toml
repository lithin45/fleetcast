[project]
name = "fleetcast"
version = "0.1.0"
description = "FleetCast — spatiotemporal NYC taxi demand forecasting with rolling-origin backtesting and conformal prediction intervals."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Linga Reddy Gudisha" }]

# Exact versions are pinned in uv.lock (committed) for reproducibility; these
# constraints keep the resolver honest while allowing security patches.
dependencies = [
    # --- Data / SQL engine ---
    "duckdb>=1.1,<2",
    "pandas>=2.1,<3",
    "pyarrow>=15,<22",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "python-dateutil>=2.9,<3",
    "holidays>=0.45,<1",
    # --- Geospatial ---
    "geopandas>=1.0,<2",
    "pyogrio>=0.8,<1",         # GDAL-bundled wheels -> no system GDAL needed
    "shapely>=2.0,<3",
    # --- Modelling ---
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "statsmodels>=0.14,<1",
    "mapie>=0.9,<1",           # time-series conformal (EnbPI / block bootstrap)
    # --- Dashboard ---
    "streamlit>=1.36,<2",
    "pydeck>=0.9,<1",
    "plotly>=5.22,<6",
]

[project.scripts]
fleetcast = "fleetcast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetcast"]

# --------------------------------------------------------------------------
# Ruff — lint + format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["fleetcast"]

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "network: test requires network access (skipped if FLEETCAST_OFFLINE=1)",
    "slow: long-running test (model training / backtest)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
