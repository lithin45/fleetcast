# FleetCast data & pipeline configuration.
# Everything that controls scope, leakage-safe feature windows, and reproducibility
# lives here so the pipeline is fully declarative. The SHA-256 of this file is hashed
# into feature artifacts (see fleetcast.config.config_hash) for reproducibility.

# --- Data scope -------------------------------------------------------------
taxi:
  # Which TLC dataset to use. "yellow" = Manhattan-heavy high-volume cabs.
  # We deliberately pick yellow (highest volume, densest panel) and state it.
  service: yellow
  # Recent months to download & model. Keep small: each monthly parquet is ~50 MB.
  # 2024 is chosen on purpose to sit BEFORE the Jan-2025 congestion-pricing regime
  # shift (a documented limitation; see README). Range is INCLUSIVE.
  months:
    - "2024-01"
    - "2024-02"
    - "2024-03"
  # Keep only the top-N highest-volume pickup zones (by total pickups across the
  # chosen months). Top-20 keeps the panel dense and the demo legible.
  top_n_zones: 20
  # Sanity filters applied during aggregation (drop obviously corrupt rows).
  filters:
    # Pickup datetime must fall within the chosen month range (TLC files contain
    # a small number of stray out-of-range timestamps).
    drop_out_of_range_timestamps: true
    # Valid TLC PULocationID range is 1..263 (1..265 incl. unknown/EWR codes).
    min_location_id: 1
    max_location_id: 263

# --- Weather enrichment (OPTIONAL) ------------------------------------------
# If the fetch fails for any reason the pipeline logs a warning and proceeds
# WITHOUT weather features. Never let weather break the run.
weather:
  enabled: true
  # Primary source: NOAA GHCN-Daily, NY City Central Park station (keyless CSV).
  source: noaa_ghcnd
  station_id: USW00094728            # NY CITY CENTRAL PARK, NY US
  # Daily elements broadcast across the 24 hours of each day:
  #   PRCP (mm*10), SNOW (mm), TMAX/TMIN (degC*10) -> converted to SI in code.
  elements: [PRCP, SNOW, TMAX, TMIN]
  # Fallback source (keyless hourly, ERA5 reanalysis) if NOAA is unreachable.
  fallback:
    source: open_meteo
    latitude: 40.7829                 # Central Park
    longitude: -73.9654

# --- Causal feature windows (leakage-safe) ----------------------------------
# All lags/rollings are computed with DuckDB window functions that EXCLUDE the
# current row. The no-leakage test asserts this property holds.
features:
  lags_hours: [1, 24, 168]            # t-1h, t-1d, t-1w (same hour last week)
  rolling_windows_hours: [24, 168]    # trailing mean/std over prior 24h / 168h
  add_holiday_flag: true              # US federal holidays (holidays package)

# --- Backtesting (rolling-origin, expanding window) -------------------------
# FleetCast forecasts ONE HOUR AHEAD (live-dispatch mode): each fold scores a
# single hour t using only information available strictly before t. The model is
# refit every `refit_every_hours` (a realistic daily-batch retrain cadence) and
# applied one-step-ahead in between. See README "Limitations" for why a 24h-ahead
# horizon cannot clear the +20% WAPE gate.
backtest:
  horizon_hours: 1                    # forecast exactly the next hour each fold
  step_hours: 1                       # roll the origin forward 1h per fold
  n_folds: 336                        # score the most recent 336 hours (14 days)
  refit_every_hours: 24               # retrain the model once per day (cached between)
  min_train_hours: 1344               # >= 8 weeks of history before the first fold
  conformal_calib_hours: 336          # last 14 days of train used to calibrate intervals

# --- Baselines --------------------------------------------------------------
baselines:
  # ARIMA (statsmodels SARIMAX). Fit per zone on a trailing window for
  # tractability (classical ARIMA gains little from very long history and the
  # rolling-origin backtest refits every fold). Seasonal period 24 = daily.
  arima:
    order: [1, 1, 1]
    seasonal_order: [1, 0, 1, 24]
    train_window_hours: 504             # trailing 3 weeks per fit
    maxiter: 50
    n_jobs: -1                          # parallelize per-zone fits (-1 = cores-1)

# --- Model (global LightGBM) ------------------------------------------------
model:
  lightgbm:
    objective: regression_l1            # MAE — aligns with the WAPE gate
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

# --- Conformal prediction ---------------------------------------------------
conformal:
  nominal_coverage: 0.90              # target 90% prediction intervals
  coverage_tolerance: 0.03            # eval gate: empirical coverage within +/-3%

# --- Evaluation gate --------------------------------------------------------
eval:
  wape_improvement_over_seasonal_naive: 0.20   # model must beat SN by >= 20% WAPE
  mape_high_volume_max: 0.15                    # report MAPE < 15% on high-volume zones
  high_volume_zone_quantile: 0.5                # "high-volume" = top 50% of chosen zones

# --- Reproducibility --------------------------------------------------------
seed: 1234

# --- Paths (relative to repo root; created on demand) -----------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  forecasts_dir: data/forecasts
