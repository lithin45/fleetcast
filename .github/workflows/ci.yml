name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Network tests are skipped in CI; the suite + eval gate run on a small,
# committed synthetic sample so they need no external downloads.
env:
  FLEETCAST_OFFLINE: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest (offline)
        run: uv run pytest

      # The eval gate runs on deterministic synthetic data (no downloads): the
      # WAPE-improvement gate is asserted by these tests, which fail the build if
      # LightGBM does not beat seasonal-naive by >= 20% (and, from Phase 5, if
      # conformal coverage drifts outside 90% +/- 3%).
      - name: Eval gate (WAPE improvement + conformal coverage)
        run: >
          uv run pytest -q
          tests/test_model.py::test_lightgbm_beats_seasonal_naive_gate
          tests/test_conformal.py::test_conformal_coverage_gate_on_synthetic
          tests/test_eval.py
